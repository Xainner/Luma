<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Luma — chat con tu LLM local, sin censura ni ataduras." />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <title>Luma — LLM Chat</title>
    <style>
      html {
        background: #09090b;
      }
      html[data-theme='light'] {
        background: #ffffff;
      }
    </style>
    <script>
      // Tema antes del primer paint (sin flash). Default: system.
      try {
        var t = localStorage.getItem('luma.theme') || 'system'
        if (t !== 'light' && t !== 'dark') t = 'system'
        var dark =
          t === 'dark' ||
          (t === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        var resolved = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = resolved
        document.documentElement.style.colorScheme = resolved
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
